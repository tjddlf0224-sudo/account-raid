<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전산회계 레이드</title>
<meta name="description" content="전산회계 2급 합격 원정대 — 수업용 레이드 게임">
<link rel="icon" href="assets/img/ic/crown.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg0:#120d2e; --bg1:#1d1548; --bg2:#2a1f63; --panel:rgba(255,255,255,.07); --panel2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14); --ink:#f6f2ff; --ink2:#c9c0ee; --ink3:#8e86b8;
  --gold:#ffcf4a; --gold2:#ff9f1c; --pink:#ff5fa2; --mint:#3ee6b0; --sky:#58c7ff; --red:#ff5a5f; --violet:#a77bff;
  --as:#4aa8ff; --li:#ff7a59; --ca:#b980ff; --re:#2fd38a; --ex:#ffb020;  /* 자산 부채 자본 수익 비용 */
  --r:18px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --hfont:'Jua','Pretendard',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#3a2a86 0%,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0));color:var(--ink);
  font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.hidden{display:none!important}
.h{font-family:var(--hfont);font-weight:400;letter-spacing:.3px}
.muted{color:var(--ink2)} .dim{color:var(--ink3)}
.gold{color:var(--gold)} .mint{color:var(--mint)} .red{color:var(--red)}
.row{display:flex;gap:12px;align-items:center} .col{display:flex;flex-direction:column;gap:12px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;
  background:var(--panel2);border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(1px) scale(.98)} .btn:hover{filter:brightness(1.12)}
.btn.gold{background:linear-gradient(180deg,#ffe07a,#ffb21c);color:#3a2300;border:0;box-shadow:0 4px 0 #c47a00,0 8px 20px rgba(255,170,0,.35)}
.btn.mint{background:linear-gradient(180deg,#6ff5c8,#20c58f);color:#04261a;border:0;box-shadow:0 4px 0 #0f8a60}
.btn.pink{background:linear-gradient(180deg,#ff8cc0,#ff4f93);color:#fff;border:0;box-shadow:0 4px 0 #b8245f}
.btn.big{padding:16px 28px;font-size:20px;border-radius:18px}
.btn[disabled]{opacity:.45;filter:grayscale(.6);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:700}
.ic{width:24px;height:24px;object-fit:contain;vertical-align:middle}
.ic.s{width:18px;height:18px} .ic.l{width:40px;height:40px}
.field{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);font-size:20px;outline:none}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,207,74,.18)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;padding:12px 20px;border-radius:14px;background:#2b2163;border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;max-width:92vw}

/* ── 입장 ── */
#landing{min-height:100vh;display:grid;place-items:center;padding:16px}
.hero{position:relative;width:min(1100px,100%);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.hero .logo{position:absolute;left:0;right:0;top:4%;text-align:center;text-shadow:0 4px 0 #6b2a00,0 8px 24px rgba(0,0,0,.6)}
.hero .logo .t1{font-family:var(--hfont);font-size:clamp(34px,6vw,76px);color:#fff;line-height:1.05}
.hero .logo .t1 b{color:var(--gold);font-weight:400}
.hero .logo .t2{font-family:var(--hfont);font-size:clamp(15px,2vw,24px);color:#ffe9b0}
.joinbox{position:absolute;right:3%;bottom:6%;width:min(380px,90%);background:rgba(20,14,50,.82);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(8px)}
@media (max-width:760px){.joinbox{position:static;width:auto;margin:12px}.hero .logo{top:2%}}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:2px}
.namegrid button{padding:10px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.namegrid button.reg::after{content:' ✓';color:var(--mint);font-size:12px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.avgrid button{border-radius:16px;background:var(--panel);border:2px solid transparent;padding:6px}
.avgrid button.on{border-color:var(--gold);background:rgba(255,207,74,.12)}
.avgrid button.lock{opacity:.35}
.avgrid img{width:100%;aspect-ratio:1}

/* ── HUD ── */
#hud{position:sticky;top:0;z-index:30;background:rgba(18,13,46,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#hud .in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:nowrap}
@media (max-width:1100px){#hud .in{flex-wrap:wrap}}
.me{display:flex;align-items:center;gap:10px;min-width:210px;cursor:pointer}
.me .av{width:52px;height:52px;border-radius:14px;background:linear-gradient(180deg,#3d2f8e,#251a5e);border:2px solid var(--gold)}
.lvbadge{font-family:var(--hfont);background:linear-gradient(180deg,#ffe07a,#ffb21c);color:#3a2300;border-radius:8px;padding:0 7px;font-size:14px}
.xpbar{height:10px;width:140px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a77bff,#ff5fa2);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.turns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.turns span{font-size:12px;padding:3px 8px;white-space:nowrap;border-radius:999px;background:var(--panel);color:var(--ink3);font-weight:700}
.turns span.done{color:var(--mint)} .turns span.now{background:linear-gradient(180deg,#ffe07a,#ffb21c);color:#3a2300}
#readybar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,13,46,.9);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
#readybar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center}
.meter{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#9dffde);width:0;transition:width .6s}
main#stage{padding-bottom:110px}

/* ── 공통 카드 ── */
.titlebar{display:flex;align-items:center;gap:14px;margin:8px 0 14px}
.titlebar .floor{font-family:var(--hfont);font-size:15px;color:#3a2300;background:var(--gold);border-radius:10px;padding:2px 10px}
.titlebar h2{margin:0;font-family:var(--hfont);font-weight:400;font-size:30px}
.mission{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:rgba(255,207,74,.1);border:1px solid rgba(255,207,74,.35);font-weight:700}

/* 주문 각인(타자) */
.spell{position:relative;max-width:820px;margin:0 auto;padding:26px;border-radius:24px;background:linear-gradient(180deg,rgba(255,240,200,.12),rgba(255,255,255,.04));border:1px solid rgba(255,220,140,.35);box-shadow:var(--shadow)}
.spell .no{position:absolute;right:20px;top:16px;color:var(--ink3);font-weight:700}
.spell h3{margin:0 0 6px;font-family:var(--hfont);font-weight:400;font-size:30px;color:var(--gold)}
.spell .ex{font-size:20px;line-height:1.6}
.spell .tip{margin-top:10px;color:#ffd9a8;font-size:16px}
.typer{margin-top:20px}
.ghost{font-size:30px;font-weight:800;letter-spacing:1px;min-height:46px;word-break:keep-all;line-height:1.5}
.ghost .c{color:rgba(255,255,255,.28)} .ghost .ok{color:var(--gold);text-shadow:0 0 14px rgba(255,207,74,.6)} .ghost .bad{color:var(--red);text-decoration:underline}
.typer input{margin-top:10px;font-size:24px}
.sealed{animation:seal .7s}
@keyframes seal{0%{transform:scale(1)}40%{transform:scale(1.04);box-shadow:0 0 60px rgba(255,207,74,.8)}100%{transform:scale(1)}}

/* 전투 */
.arena{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.arena{grid-template-columns:1fr}}
.foe{position:relative;text-align:center;padding:12px;border-radius:22px;background:radial-gradient(circle at 50% 60%,rgba(255,95,162,.25),transparent 70%)}
.foe img{width:200px;height:200px;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));transition:transform .1s}
.foe.hit img{animation:hit .35s} @keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-4deg);filter:brightness(2)}60%{transform:translateX(8px)}100%{transform:none}}
.foe .nm{font-family:var(--hfont);font-size:20px}
.foe .combo img{width:34px;height:34px;filter:none}
.combo{font-family:var(--hfont);font-size:28px;color:var(--gold2);text-shadow:0 0 18px rgba(255,159,28,.7);min-height:40px}
.qcard{padding:22px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:var(--shadow)}
.qcard .kind{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;background:rgba(167,123,255,.25);color:#d8c7ff;margin-bottom:8px}
.qcard .q{font-size:24px;font-weight:700;line-height:1.5;word-break:keep-all}
.qcard .why{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,90,95,.12);border:1px solid rgba(255,90,95,.4);font-size:17px}
.qcard .why b{color:var(--gold)}
.qcard.shake{animation:shake .4s} @keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.progress{display:flex;gap:4px;margin:10px 0}
.progress i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.12)}
.progress i.ok{background:var(--mint)} .progress i.no{background:var(--red)} .progress i.now{background:var(--gold)}
.opts{display:grid;gap:10px;margin-top:14px}
.opts button{text-align:left;padding:14px 16px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font-size:18px;font-weight:600}
.opts button .k{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.15);margin-right:10px;font-weight:800}
.opts button.ok{border-color:var(--mint);background:rgba(62,230,176,.15)} .opts button.no{border-color:var(--red);background:rgba(255,90,95,.15)}
.sidebtn{display:flex;gap:12px;margin-top:14px}

/* 케이렙 전표 */
.slip{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid #6a7da8;background:#f3f6fb;color:#1a2233;font-family:'Pretendard','Malgun Gothic',sans-serif}
.slip table{width:100%;border-collapse:collapse;font-size:16px}
.slip th{background:linear-gradient(180deg,#5b7bb7,#3f5e9a);color:#fff;font-weight:700;padding:7px 6px;font-size:14px;border-right:1px solid #2f4a80}
.slip td{border-top:1px solid #c5d0e3;border-right:1px solid #dbe2ee;padding:0}
.slip td.lbl{background:#e6ecf7;text-align:center;font-weight:800;width:62px;font-size:14px}
.slip tr.dr td.lbl{color:#1b56c4} .slip tr.cr td.lbl{color:#c4321b}
.slip input{width:100%;border:0;background:transparent;padding:9px 8px;font-size:17px;outline:none;color:#1a2233}
.slip input:focus{background:#fff6c7}
.slip input.amt{text-align:right;font-variant-numeric:tabular-nums}
.slip .code{width:56px;color:#5a6a8a;text-align:center;font-size:14px}
.slip tfoot td{background:#e6ecf7;font-weight:800;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
.slip .bad{background:#ffe1e1!important} .slip .good{background:#dff7ea!important}
.codehelp{position:absolute;z-index:40;background:#fff;color:#1a2233;border:1px solid #5b7bb7;border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow:auto;min-width:220px;font-size:15px}
.codehelp div{padding:6px 10px;display:flex;gap:10px;cursor:pointer} .codehelp div.on,.codehelp div:hover{background:#dce7ff}
.codehelp b{color:#3f5e9a;width:34px}

/* 점수 팝 */
.pop{position:fixed;pointer-events:none;z-index:95;font-family:var(--hfont);font-size:30px;color:var(--gold);text-shadow:0 3px 0 #7a4300,0 0 18px rgba(255,207,74,.8);animation:pop 1s forwards}
.pop.crit{color:#ff6b6b;font-size:40px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:94}

/* 레이드 */
.raid{text-align:center}
.boss{position:relative;display:inline-block}
.boss img{width:min(340px,70vw);height:min(340px,70vw);object-fit:contain;filter:drop-shadow(0 14px 30px rgba(0,0,0,.55))}
.boss.hit img{animation:hit .3s}
.boss.dead img{animation:die 1.4s forwards} @keyframes die{0%{transform:none}30%{transform:scale(1.1) rotate(-6deg);filter:brightness(3)}100%{transform:scale(.2) rotate(30deg);opacity:0}}
.hpbar{position:relative;height:30px;border-radius:99px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.25);overflow:hidden;max-width:760px;margin:8px auto}
.hpbar i{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#ff3d6e,#ff9a3d);transition:width .5s}
.hpbar span{position:relative;font-weight:800;line-height:26px;text-shadow:0 2px 4px #000}
.raidq{max-width:760px;margin:10px auto}

/* 결과·카드 */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:10px 0 20px}
.podium .p{text-align:center;width:150px}
.podium .p img.a{width:110px;height:110px}
.podium .p .blk{border-radius:16px 16px 0 0;background:linear-gradient(180deg,#ffe07a,#c98a00);color:#3a2300;font-family:var(--hfont);font-size:34px;display:grid;place-items:center}
.podium .p:nth-child(1) .blk{height:110px;background:linear-gradient(180deg,#e6ecf7,#9aa7bf)}
.podium .p:nth-child(2) .blk{height:150px}
.podium .p:nth-child(3) .blk{height:80px;background:linear-gradient(180deg,#ffc89a,#b86a2d)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;aspect-ratio:3/4;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:2px solid var(--line);overflow:hidden}
.card .cls{align-self:flex-start;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff}
.card .art{width:78%;aspect-ratio:1;object-fit:contain}
.card .nm{font-family:var(--hfont);font-size:20px;text-align:center;line-height:1.1}
.card .rar{position:absolute;right:8px;top:8px;font-family:var(--hfont);font-size:14px}
.card.R{border-color:#58c7ff} .card.SR{border-color:#c48bff;box-shadow:0 0 18px rgba(196,139,255,.45)} .card.SSR{border-color:var(--gold);box-shadow:0 0 26px rgba(255,207,74,.65)}
.card.lock{filter:grayscale(1) brightness(.4)}
.card .n{position:absolute;left:8px;bottom:6px;font-size:12px;color:var(--ink2)}
.cls-자산{background:var(--as)} .cls-부채{background:var(--li)} .cls-자본{background:var(--ca)} .cls-수익{background:var(--re)} .cls-비용{background:var(--ex)}
.flip{perspective:900px} .flip .inner{transition:transform .7s;transform-style:preserve-3d;position:relative;width:100%;height:100%}
.flip.open .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden}
.flip .back{display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#ffcf4a,#ff5fa2 60%,#7b5cff);border:3px solid #fff3}
.flip .front{transform:rotateY(180deg)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(6,4,20,.72);display:grid;place-items:center;padding:16px}
.modal .box{width:min(860px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#2a1f63,#1a1440);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.lvup{font-family:var(--hfont);font-size:64px;color:var(--gold);text-shadow:0 6px 0 #7a4300,0 0 40px rgba(255,207,74,.8);animation:lvup 1.6s}
@keyframes lvup{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}

/* 교사·전광판 */
.tgrid{width:100%;border-collapse:collapse;font-size:15px}
.tgrid th{position:sticky;top:0;background:#241a58;text-align:left;padding:8px;font-size:13px;color:var(--ink2)}
.tgrid td{padding:6px 8px;border-top:1px solid var(--line)}
.tgrid img{width:34px;height:34px;vertical-align:middle}
.dot{display:inline-block;width:14px;height:14px;border-radius:5px;background:rgba(255,255,255,.12);margin-right:3px}
.dot.on{background:var(--mint)} .dot.cur{outline:2px solid var(--gold)}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.stagegrid button{text-align:left;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stagegrid button .n{font-family:var(--hfont);color:var(--gold)}
.stagegrid button.done{border-color:var(--mint)}
.part1{border-left:5px solid #58c7ff!important}.part2{border-left:5px solid #ff7a59!important}.part3{border-left:5px solid #b980ff!important}.part4{border-left:5px solid #2fd38a!important}
.part5{border-left:5px solid #ffb020!important}.part6{border-left:5px solid #ff5fa2!important}.part7{border-left:5px solid #9aa7bf!important}.part8{border-left:5px solid #ffcf4a!important}
#board{min-height:100vh;padding:24px}
.bbig{font-family:var(--hfont);font-size:clamp(40px,6vw,96px);line-height:1}
.brow{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
.rankrow{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:16px;background:var(--panel);margin-bottom:8px;font-size:24px;transition:transform .5s}
.rankrow img{width:56px;height:56px}
.rankrow .s{margin-left:auto;font-family:var(--hfont);color:var(--gold)}
</style>
</head>
<body>
<div id="fx"></div>

<!-- 입장 -->
<section id="landing" class="hidden">
  <div class="hero">
    <img src="assets/img/hero.webp" alt="">
    <div class="logo"><div class="t1">전산회계 <b>레이드</b></div><div class="t2">129회 전산회계 2급 합격 원정대</div></div>
    <div class="joinbox" id="joinbox"></div>
  </div>
</section>

<!-- 학생 화면 -->
<div id="hud" class="hidden"><div class="in">
  <div class="me"><img class="av" id="hudAv" alt=""><div>
    <div class="row" style="gap:8px"><b id="hudName"></b><span class="lvbadge" id="hudLv">Lv 1</span></div>
    <div class="row" style="gap:8px"><div class="xpbar"><i id="hudXp"></i></div><span class="dim" id="hudXpTxt" style="font-size:12px"></span></div>
  </div></div>
  <span class="pill"><img class="ic s" src="assets/img/ic/coin.webp" alt=""><span id="hudGold">0</span></span>
  <button class="pill" id="hudPacks" title="카드팩"><img class="ic s" src="assets/img/ic/chest.webp" alt=""><span id="hudPackN">0</span></button>
